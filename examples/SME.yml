UserProfile:
  name: Elena
  aiKnowledge: Limited hands-on experience with AI tools
  aiAttitude: Skeptical
  aiConfidence: Low to moderate confidence
  role: HR Director

AIMProResource:
  name: AI Ethics Guidelines
  uri: https://www.example.com/ai-ethics-guidelines
  tags:
    - AIMProCompetency: AI Workflow Integration

AIMProResource:
  name: AI Implementation Best Practices
  uri: https://www.example.com/ai-implementation-best-practices
  tags:
    - AIMProCompetency: AI Output Evaluation
    - AIMProCompetency: AI Workflow Integration
    - AIMProCompetency: AI Concept Understanding

iSQDLearningScenario:
  learningContext: Small-Medium Enterprise
  populationTarget:
    SelfLS:
      learnerProfile:
        UserProfile: Elena
  scenarioGoal:
    CustomCourseLS:
      competencyGoals:
        - AIMProCompetency: AI Concept Understanding
        - AIMProCompetency: AI Output Evaluation
        - AIMProCompetency: AI Workflow Integration
  phases:
    - LearningPhase:
        name: Evaluating AI Outputs
        duration: 90 minutes
        resources:
          - AIMProResource: AI Ethics Guidelines
        nextPhases:
          - LearningPhase: Integrating AI into Workflows
        strategies:
          - SC1_BuildingAIKnowledge:
              name: Building AI Knowledge
              strategyAssessment:
                - SC24_AttitudesAndBeliefs:
                    name: Attitudes and Beliefs
                    evaluationCriteria: The learner demonstrates an understanding of AI concepts and ethical considerations.
                    fallbackStrategies:
                      - SC5_ScaffoldedExploration: Scaffolded Exploration
          - SC5_ScaffoldedExploration:
              name: Scaffolded Exploration
    - LearningPhase:
        name: Integrating AI into Workflows
        duration: 120 minutes
        resources:
          - AIMProResource: AI Implementation Best Practices
        strategies:
          - SC6_OpenExploration:
              name: Open Exploration
              strategyAssessment:
                - SC25_SelfEfficacy:
                    name: Self-Efficacy
                    evaluationCriteria: The learner demonstrates confidence in applying AI tools to their work processes.
                    fallbackStrategies:
                        - SC12_PeerSupport: Peer Support
          - SC12_PeerSupport:
              name: Peer Support
          - SC15_CoCreationWithAI:
              name: Co-Creation with AI
              strategyAssessment:
                - SC23_EmotionalReactions:
                    name: Emotional Reactions
                    evaluationCriteria: The learner demonstrates emotional intelligence when interacting with AI tools.
                    fallbackStrategies:
                      - SC6_OpenExploration: Open Exploration
  
