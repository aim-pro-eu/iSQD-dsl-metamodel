iSQDLearningScenario:
  learningContext: Higher Education
  populationTarget:
    OtherLS:
      teacherProfile:
        UserProfile: Dr. Clara
      classProfile:
        name: AI Literacy Course Class
        aiKnowledge: The students use AI Tools daily for study and for fun, but without a structured approach
        aiAttitude: Enthusiastic
        aiConfidence: Moderate confidence
        role: Undergraduate Students
        n_students: 15
        
  scenarioGoal:
    CustomCourseLS:
      competencyGoals:
        - AIMProCompetency: AI Interaction & Prompting
        - AIMProCompetency: Sustainable AI Model Selection
  phases:
    - LearningPhase:
        name: Exploring Prompt Engineering Techniques Syllabus
        duration: 8 hours
        subphases:
          - LearningPhase:
              name: Introduction to Prompt Engineering
              duration: 4 hours
              goals:
                - AIMProCompetency: AI Interaction & Prompting
              resources:
                - AIMProResource: Prompt Engineering Techniques
              strategies:
                - SC5_ScaffoldedExploration:
                  name: Scaffolded Exploration
                - SC6_OpenExploration:
                  name: Open Exploration
                  strategyAssessment:
                    - SC25_SelfEfficacy:
                        name: Self-Efficacy
                        evaluationCriteria: The learner demonstrates confidence in applying prompt engineering techniques.
                        fallbackStrategies:
                          - SC5_ScaffoldedExploration: Scaffolded Exploration
                - SC17_IteractivePrompting:
                  name: Interactive Prompting
              nextPhases:
                - LearningPhase: Sustainable AI Model Selection
          - LearningPhase:
              name: Sustainable AI Model Selection
              duration: 4 hours
              goals:
                - AIMProCompetency: Sustainable AI Model Selection
              resources:
                - AIMProResource: Sustainable AI Model Selection Guide
              strategies:
                - SC9_DocumentedReflection:
                    name: Documented Reflection
                - SC10_ReflectiveDiscussion:
                    name: Reflective Discussion
                - SC22_ResponsibleAIUse:
                    name: Responsible AI Use
                    strategyAssessment:
                      - SC24_AttitudesAndBeliefs:
                          name: Attitudes and Beliefs
                          evaluationCriteria: The learner demonstrates an understanding of sustainable AI model selection principles.
                          fallbackStrategies:
                            - SC9_DocumentedReflection: Documented Reflection